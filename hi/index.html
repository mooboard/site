<!doctype html>
<!-- mooboard.co/hi and every unknown path (GitHub Pages serves 404.html): finds the MooBoards on this phone's
     network through api.mooboard.co and opens one's portal. 404.html and hi/index.html are the same file
     (tools/hi.test.mjs checks): the script decides by the path. No assets but the api fetch. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0E1A22">
<title>MooBoard</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:32px 20px;background:#0E1A22;color:#DDEBE7;text-align:center;font:17px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{width:100%;max-width:420px}
.cow{display:block;width:128px;height:auto;margin:0 auto 24px}
h1{margin:0 0 10px;font-size:1.6rem;line-height:1.2;font-weight:800;color:#fff;letter-spacing:-.01em;overflow-wrap:anywhere}
p{margin:0 0 22px;color:#A9BDB8}
a{color:#77EDD7}
.btn{display:block;width:100%;padding:15px 20px;border:0;border-radius:16px;background:#77EDD7;color:#0E1A22;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
.link{display:inline-block;margin-top:14px;padding:8px 12px;border:0;background:none;color:#77EDD7;font:inherit;text-decoration:underline;cursor:pointer}
.quiet{margin:20px 0 0;font-size:.875rem;color:#7F9792}
.foot{margin:24px 0 0;font-size:.9375rem}
.cards{display:grid;gap:12px;margin:0 0 4px}
.card{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border-radius:18px;background:#15262F;border:1px solid #23404A;color:#fff;font:inherit;text-align:left;cursor:pointer}
.card:active{background:#1B313C}
.mini svg{display:block;width:52px;height:auto}
.who{min-width:0}
.who b{display:block;font-size:1.35rem;line-height:1.2;font-weight:800;overflow-wrap:anywhere}
.who small{display:block;margin-top:3px;color:#77EDD7;font-size:.85rem;letter-spacing:.14em}
.row{display:flex;gap:10px}
.row .card{flex:1;min-width:0}
.ident{display:flex;align-items:center;justify-content:center;flex:none;padding:0 16px;border-radius:18px;background:none;border:1px solid #77EDD7;color:#77EDD7;font:inherit;font-size:.9375rem;font-weight:700;text-decoration:none;cursor:pointer}
.ident:active{background:#15262F}
.setup{margin:28px 0 0;padding:18px 20px;border-radius:18px;background:#15262F;border:1px solid #23404A;text-align:left}
.setup h2{margin:0 0 10px;font-size:1.05rem;line-height:1.3;color:#fff}
.setup ol{margin:0;padding-left:1.3em;color:#A9BDB8}
.setup li+li{margin-top:6px}
@media (max-width:360px){body{padding:24px 14px}.card{gap:10px;padding:12px}.mini svg{width:40px}.who b{font-size:1.2rem}.row{gap:8px}.ident{padding:0 12px}}
</style>
</head>

<main>
<svg class="cow" viewBox="0 0 136 108" role="img" aria-label="MooBoard"><use href="#cow"/></svg>
<div id="view" aria-live="polite"><noscript><h1>Open mooboard.local</h1><p>This page needs JavaScript. On your home Wi-Fi, <a href="http://mooboard.local">mooboard.local</a> opens your MooBoard too.</p></noscript></div>
</main>
<script>
(function () {
  'use strict';
  var API = 'https://api.mooboard.co';
  var ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';   // the label's: no 0/O, no 1/I/L
  var INK = '#0E1A22';
  var TIMEOUT_MS = 6000;
  var AUTO_GO_MS = 1500;
  var TICK_MS = 100;   // the panel's startup card gives the pupils a new colour every 100 ms
  var view = document.getElementById('view');
  var pupils = [document.getElementById('pl'), document.getElementById('pr')];
  var rainbow = null;
  var autoGo = null;

  function validCode(c) {
    if (typeof c !== 'string' || c.length !== 4) return false;
    for (var i = 0; i < 4; i++) if (ALPHABET.indexOf(c.charAt(i)) < 0) return false;
    return true;
  }

  // 10/8, 172.16/12 or 192.168/16, written plainly: the only kind of address this page will send anyone to.
  function privateIPv4(s) {
    var m = typeof s === 'string' && /^(0|[1-9]\d{0,2})\.(0|[1-9]\d{0,2})\.(0|[1-9]\d{0,2})\.(0|[1-9]\d{0,2})$/.exec(s);
    if (!m) return false;
    var o = [+m[1], +m[2], +m[3], +m[4]];
    if (o[0] > 255 || o[1] > 255 || o[2] > 255 || o[3] > 255) return false;
    return o[0] === 10 || (o[0] === 172 && o[1] >= 16 && o[1] <= 31) || (o[0] === 192 && o[1] === 168);
  }

  // A board's code (/hi/5KAS, /wall/5kas/, a bare /5KAS ...), the boards near you (/hi), an older word that now
  // means /hi, or nothing.
  function route(pathname) {
    var path = String(pathname).replace(/\/index\.html$/, '/');
    var m = /^\/(?:(?:hi|hello|wall|my|moo|go|open)\/)?([A-Za-z0-9]{4})\/?$/i.exec(path);
    if (m && validCode(m[1].toUpperCase())) return { kind: 'code', code: m[1].toUpperCase() };
    var w = /^\/(hi|hello|wall|my|moo|go|open)\/?$/i.exec(path);
    if (w) return w[1].toLowerCase() === 'hi' ? { kind: 'nearby' } : { kind: 'toHi' };
    return { kind: 'missing' };
  }

  // The loading cow: a random full hue in each pupil every tick, as on the panel, and black again once settled.
  function tick() {
    for (var i = 0; i < pupils.length; i++) {
      if (pupils[i]) pupils[i].setAttribute('fill', 'hsl(' + Math.floor(Math.random() * 360) + ',100%,50%)');
    }
  }
  function spin(on) {
    if (rainbow !== null) clearInterval(rainbow);
    rainbow = null;
    if (on) {
      tick();
      rainbow = setInterval(tick, TICK_MS);
      return;
    }
    for (var i = 0; i < pupils.length; i++) if (pupils[i]) pupils[i].setAttribute('fill', INK);
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function link(cls, text, href) {
    var a = el('a', cls, text);
    a.setAttribute('href', href);
    return a;
  }
  function button(cls, text, onClick) {
    var b = el('button', cls, text);
    b.setAttribute('type', 'button');
    b.addEventListener('click', onClick);
    return b;
  }
  function show(nodes) {
    if (autoGo !== null) clearTimeout(autoGo);
    autoGo = null;
    view.textContent = '';
    for (var i = 0; i < nodes.length; i++) view.appendChild(nodes[i]);
  }
  function guide() {
    var p = el('p', 'foot');
    p.appendChild(link('', 'Setup guide', 'https://mooboard.co/guide'));
    return p;
  }
  // One board: a mini cow, its name big and its code small. Names go in as text, never as markup.
  function card(board, onClick) {
    var c = button('card', undefined, onClick);
    var mini = el('span', 'mini');
    mini.innerHTML = '<svg viewBox="0 0 136 108" aria-hidden="true"><use href="#cow"/></svg>';
    c.appendChild(mini);
    var who = el('span', 'who');
    who.appendChild(el('b', '', board.name));
    if (validCode(board.code)) who.appendChild(el('small', '', board.code));
    c.appendChild(who);
    return c;
  }
  // The boards' cards, each with its Identify button beside it when `identify` makes one.
  function cards(boards, onPick, identify) {
    var list = el('div', 'cards');
    boards.forEach(function (b) {
      var c = card(b, function () { onPick(b); });
      if (identify) {
        var r = el('div', 'row');
        r.appendChild(c);
        r.appendChild(identify(b));
        list.appendChild(r);
      } else {
        list.appendChild(c);
      }
    });
    return list;
  }

  // Identify: the board flashes its light and its cow moos, on its own page in a new tab (an https page cannot
  // fetch a board's http address). A real link when the address is known, so no popup blocker stands in the way.
  function identifyLink(board) {
    var a = link('ident', 'Identify', 'http://' + board.localIp + '/identify');
    a.setAttribute('target', '_blank');
    a.setAttribute('rel', 'noopener noreferrer');
    a.setAttribute('aria-label', 'Identify ' + board.name);
    return a;
  }

  // On a shared connection the address comes from /lookup after the tap, so the tab is opened in the tap itself
  // (a tab opened later would be blocked) and sent to the board once the address is in.
  function identifyButton(board) {
    var b = button('ident', 'Identify', function () { identifyShared(board); });
    b.setAttribute('aria-label', 'Identify ' + board.name);
    return b;
  }

  function identifyShared(board) {
    var tab = window.open('', '_blank');
    if (tab) {
      try { tab.opener = null; } catch (e) { /* a tab that will not let go of us is still a tab */ }
    }
    function fail() {
      if (tab) {
        try { tab.close(); } catch (e) { /* already gone */ }
      }
      showNone();
    }
    getJSON('/lookup/' + board.code).then(function (data) {
      if (!data || data.found !== true || !privateIPv4(data.localIp)) return fail();
      var url = 'http://' + data.localIp + '/identify';
      if (tab) tab.location.href = url;
      else location.href = url;   // no new tab allowed: this one, and the board's page links back to the list
    }, fail);
  }

  function getJSON(path) {
    var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, TIMEOUT_MS);
    var opts = { cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer' };
    if (ctrl) opts.signal = ctrl.signal;
    return fetch(API + path, opts)
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (data) {
        clearTimeout(timer);
        return data;
      }, function (err) {
        clearTimeout(timer);
        throw err;
      });
  }

  function go(ip, name) {
    if (!privateIPv4(ip)) return showNone();
    show([el('h1', '', 'Opening ' + (name || 'your MooBoard') + '…')]);
    spin(false);
    location.replace('http://' + ip + '/');
  }

  function showLoading(title) {
    show([el('h1', '', title), el('p', '', 'One moment.')]);
    spin(true);
  }

  // A new board is on nobody's network yet: its setup screen shows its own Wi-Fi's name and an 8-digit code.
  function setupSteps() {
    var box = el('section', 'setup');
    box.appendChild(el('h2', '', 'Setting up a new MooBoard?'));
    var ol = el('ol');
    ol.appendChild(el('li', '', 'Plug it in. The screen shows a Wi-Fi name and code.'));
    ol.appendChild(el('li', '', 'Join MooBoard-XXXX on your phone with that code.'));
    ol.appendChild(el('li', '', 'The setup page opens. Pick your home Wi-Fi.'));
    var back = el('li', '', 'Come back to ');
    back.appendChild(link('', 'mooboard.co/hi', '/hi'));
    back.appendChild(document.createTextNode('.'));
    ol.appendChild(back);
    box.appendChild(ol);
    return box;
  }

  function showNone() {
    spin(false);
    show([
      el('h1', '', 'Open this on the same Wi-Fi as your MooBoard'),
      el('p', '', 'Connect this phone to your home Wi-Fi, then open the link again.'),
      link('btn', 'Try mooboard.local', 'http://mooboard.local'),
      el('p', 'quiet', 'A VPN or iCloud Private Relay can hide that you are home. Turn it off for your home Wi-Fi, or tap the button above.'),
      setupSteps(),
      guide()
    ]);
  }

  function showMissing() {
    spin(false);
    show([el('h1', '', 'Page not found'), el('p', '', 'There is nothing at this address.'), link('btn', 'Go to mooboard.co', '/')]);
  }

  // Exactly one board: say so, and open it after a moment unless "Stay here" is tapped.
  function showOne(board) {
    spin(false);
    show([
      el('h1', '', 'Opening ' + board.name + '…'),
      cards([board], function (b) { go(b.localIp, b.name); }),
      button('link', 'Stay here', function () { showPicked(board); })
    ]);
    autoGo = setTimeout(function () {
      autoGo = null;
      go(board.localIp, board.name);
    }, AUTO_GO_MS);
  }

  function showPicked(board) {
    show([
      el('h1', '', 'Your MooBoard'),
      el('p', '', 'Tap it to open it.'),
      cards([board], function (b) { go(b.localIp, b.name); }),
      guide()
    ]);
  }

  // Several boards: tap one to open it, or Identify it to see which board on the wall it is.
  function showList(boards) {
    spin(false);
    show([
      el('h1', '', 'Pick your MooBoard'),
      el('p', '', 'Tap a board to open it. Identify makes it moo.'),
      cards(boards, function (b) { go(b.localIp, b.name); }, identifyLink),
      guide()
    ]);
  }

  // A shared internet connection (apartments, dorms): the list has no addresses. A tap asks for that board by its
  // code and opens it, and Identify finds out first whether it is the one on your wall.
  function showShared(boards) {
    spin(false);
    show([
      el('h1', '', 'Pick your MooBoard'),
      el('p', '', 'This internet connection is shared. Identify makes a board moo, so you know it is yours.'),
      cards(boards, openShared, identifyButton),
      guide()
    ]);
  }

  function openShared(board) {
    showLoading('Finding ' + board.name);
    getJSON('/lookup/' + board.code).then(function (data) {
      if (!data || data.found !== true || !privateIPv4(data.localIp)) return showNone();
      go(data.localIp, typeof data.name === 'string' && data.name !== '' ? data.name : board.name);
    }, showNone);
  }

  function nearby() {
    showLoading('Looking for your MooBoard');
    getJSON('/nearby').then(function (data) {
      var list = data && Array.isArray(data.boards) ? data.boards : [];
      var named = list.filter(function (b) { return b && typeof b.name === 'string' && b.name !== ''; });
      if (data && data.shared === true) {
        var shared = named.filter(function (b) { return validCode(b.code); });
        return shared.length ? showShared(shared) : showNone();
      }
      var boards = named.filter(function (b) { return privateIPv4(b.localIp); });
      if (boards.length === 0) return showNone();
      if (boards.length === 1) return showOne(boards[0]);
      showList(boards);
    }, showNone);
  }

  // A printed link: straight to that board when this phone is on its network.
  function direct(code) {
    showLoading('Finding your MooBoard');
    getJSON('/lookup/' + code).then(function (data) {
      if (data && data.found === true && privateIPv4(data.localIp)) {
        return go(data.localIp, typeof data.name === 'string' && data.name !== '' ? data.name : '');
      }
      showNone();
    }, showNone);
  }

  var r = route(location.pathname);
  if (r.kind === 'code') direct(r.code);
  else if (r.kind === 'nearby') nearby();
  else if (r.kind === 'toHi') location.replace('/hi');
  else showMissing();
})();
</script>
</body>
</html>
