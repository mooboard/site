<p id="next"></p>
</main>
<script>
// the result api.mooboard.co sends in r and s + plus pupils when it worked and x pupils when it did not as on /hi
(function () {
  'use strict';
  var INK = '#0E1A22';
  var PLUS = ['', '-n', '-e', '-s', '-w'];
  var CROSS = ['', '-ne', '-se', '-sw', '-nw'];
  var q = new URLSearchParams(location.search);
  var r = q.get('r');
  var s = q.get('s');
  var name = s === 'spotify' ? 'Spotify' : s === 'google' ? 'Google' : '';
  var say = 'That sign-in link expired.';
  var next = 'Go back and try again.';
  var shape = CROSS;
  var closing = false;
  if (r === 'ok' && name) {
    say = 'Signed in to ' + name + '.';
    next = 'Closing in 3';
    shape = PLUS;
    closing = true;
  } else if (r === 'refused') {
    say = 'Sign-in was canceled.';
  } else if (r === 'notallowed' && s === 'spotify') {
    say = 'This Spotify account is not on the tester list yet.';
    next = 'Ask the mooboard team to add it.';
  }
  document.getElementById('say').textContent = say;
  document.getElementById('next').textContent = next;
  ['pl', 'pr'].forEach(function (eye) {
    shape.forEach(function (cell) {
      var dot = document.getElementById(eye + cell);
      if (dot) dot.setAttribute('fill', INK);
    });
  });
  // a sign-in that worked counts down from 3 and closes this tab back to the setup page (owner 2026-10-08) + the line
  // to go back by hand for a browser that keeps the tab open
  if (closing) {
    var left = 3;
    var line = document.getElementById('next');
    var tick = setInterval(function () {
      left -= 1;
      if (left > 0) {
        line.textContent = 'Closing in ' + left;
        return;
      }
      clearInterval(tick);
      window.close();
      setTimeout(function () {
        line.textContent = 'Go back to the setup page.';
      }, 300);
    }, 1000);
  }
})();
</script>
